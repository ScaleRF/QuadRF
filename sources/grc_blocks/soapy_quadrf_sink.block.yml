id: soapy_quadrf_sink
label: Soapy QuadRF Sink
flags: [python, throttle]

parameters:
  - id: type
    label: Input Type
    dtype: enum
    options: [fc32, sc8]
    option_labels: [Complex Float32, Complex Byte]
    option_attributes:
      type: [fc32, sc8]
    hide: part

  - id: dev_args
    label: Device arguments
    dtype: string
    hide: ${'part' if not dev_args else 'none'}

  - id: samp_rate
    label: Sample Rate
    dtype: float
    default: 'samp_rate'

  - id: center_freq
    label: 'Center Freq (Hz)'
    category: RF Options
    dtype: real
    default: '5.6e9'

  - id: gain
    label: 'RF Gain (0dB - 63dB)'
    category: RF Options
    dtype: real
    default: '20'
    hide: part

  - id: bandwidth
    label: 'Analog Bandwidth'
    category: RF Options
    dtype: enum
    options: [0, 20000000, 40000000]
    option_labels: ['Auto (Unchanged)', '20 MHz', '40 MHz']
    default: '0'
    hide: part

  - id: follow_rx
    label: 'Follow RX LO'
    category: RF Options
    dtype: bool
    default: 'False'
    hide: part

  - id: ant1
    label: 'Tx1 Active'
    category: Front-end
    dtype: bool
    default: 'True'
    hide: part

  - id: ant2
    label: 'Tx2 Active'
    category: Front-end
    dtype: bool
    default: 'True'
    hide: part

  - id: ant3
    label: 'Tx3 Active'
    category: Front-end
    dtype: bool
    default: 'True'
    hide: part

  - id: ant4
    label: 'Tx4 Active'
    category: Front-end
    dtype: bool
    default: 'True'
    hide: part

  - id: phase1
    label: 'Tx1 Phase (deg)'
    category: Front-end
    dtype: real
    default: '0'
    hide: part

  - id: phase2
    label: 'Tx2 Phase (deg)'
    category: Front-end
    dtype: real
    default: '0'
    hide: part

  - id: phase3
    label: 'Tx3 Phase (deg)'
    category: Front-end
    dtype: real
    default: '0'
    hide: part

  - id: phase4
    label: 'Tx4 Phase (deg)'
    category: Front-end
    dtype: real
    default: '0'
    hide: part

  - id: tone_en
    label: 'Test Tone Enable'
    category: Diagnostics
    dtype: bool
    default: 'False'
    hide: part

  - id: tone_freq
    label: 'Test Tone Freq (Hz)'
    category: Diagnostics
    dtype: real
    default: '1.0e6'
    hide: part

inputs:
  - domain: stream
    dtype: ${ type.type }
    multiplicity: 1

  - domain: message
    id: cmd
    optional: true

templates:
  imports: from gnuradio import soapy
  make: |
      None
      dev = 'driver=mipi'
      stream_args = ''
      tune_args = ['']
      settings = ['']

      def _set_${id}_antennas(a1, a2, a3, a4):
          mask = (1 if a1 else 0) | (2 if a2 else 0) | (4 if a3 else 0) | (8 if a4 else 0)
          self.${id}.write_setting(0, 'antennas', str(mask))
      self.set_${id}_antennas = _set_${id}_antennas

      self.${id} = soapy.sink(dev, "${type}", 1, ${dev_args},
                              stream_args, tune_args, settings)
      self.${id}.set_sample_rate(0, ${samp_rate})
      self.${id}.set_bandwidth(0, ${bandwidth})
      self.${id}.set_frequency(0, ${center_freq})
      self.${id}.set_gain(0, min(max(${gain}, 0.0), 63.0))
      self.${id}.write_setting(0, 'follow_rx', str('true' if ${follow_rx} else 'false'))
      self.set_${id}_antennas(${ant1}, ${ant2}, ${ant3}, ${ant4})
      self.${id}.write_setting(0, 'p1', str(${phase1}))
      self.${id}.write_setting(0, 'p2', str(${phase2}))
      self.${id}.write_setting(0, 'p3', str(${phase3}))
      self.${id}.write_setting(0, 'p4', str(${phase4}))
      if ${tone_en}:
          self.${id}.write_setting(0, 'tone_en', 'true')
          self.${id}.write_setting(0, 'tone_freq', str(${tone_freq}))

  callbacks:
    - set_sample_rate(0, ${samp_rate})
    - set_bandwidth(0, ${bandwidth})
    - set_frequency(0, ${center_freq})
    - set_gain(0, min(max(${gain}, 0.0), 63.0))
    - write_setting(0, 'follow_rx', str('true' if ${follow_rx} else 'false'))
    - self.set_${id}_antennas(${ant1}, ${ant2}, ${ant3}, ${ant4})
    - write_setting(0, 'p1', str(${phase1}))
    - write_setting(0, 'p2', str(${phase2}))
    - write_setting(0, 'p3', str(${phase3}))
    - write_setting(0, 'p4', str(${phase4}))
    - write_setting(0, 'tone_en', str('true' if ${tone_en} else 'false'))
    - write_setting(0, 'tone_freq', str(${tone_freq}))

documentation: |-
    Soapy QuadRF Sink Block
    -----------------------
    TX SDR block for the QuadRF transceiver using MIPI DSI.

    Streaming & Sampling:
      - Formats:
        * fc32 (Complex Float32): Standard 32-bit floating point I/Q.
        * sc8 (Complex Signed 8-bit): raw 8-bit I/Q.
      - Sample Rates:
        * Resampled: 1.0 to 80.0 Msps host rates (polyphase Farrow resampler upsamples to MIPI payload rate).
        * Native Line Rate: ~86.08 Msps direct streaming.

    RF & Front-End Control:
      - Frequency: 5.15 GHz to 5.95 GHz (5.6 GHz nominal).
      - Gain: 0 dB to 63 dB manual TX gain control.
      - Follow RX LO: Locks TX synthesizer to the RX local oscillator frequency to prevent inter-LO beating.
      - Analog Bandwidth: Baseband analog low-pass filter selection (Auto, 20 MHz, or 40 MHz).
      - Antenna Masks (Tx1-Tx4): Individual antenna element transmit enable toggles.
      - Phase Offsets (p1-p4): Per-element TX phase adjustments (0 to 360 deg, 7-bit resolution / 2.8125 deg step).

    Diagnostics:
      - Test Tone: Generates an internal FPGA calibration/test CW tone at specified frequency offset.

file_format: 1
