# DietPi mounts tmpfs on /var/log (dietpi-ramlog, 50M).
# By default, journal logs remain in volatile RAM (/run/log/journal) for max performance and zero flash wear.
# Enabling quadrf-journal.service bind-mounts /var/lib/quadrf/journal onto /var/log/journal for persistent storage.
[Journal]
Storage=auto
SplitMode=none
RuntimeMaxUse=32M
SystemMaxUse=64M
SystemKeepFree=128M
MaxRetentionSec=14day
Compress=yes
