location /GUI/ {
    rewrite ^/GUI/(.*)$ /$1 permanent;
}
location = /GUI { return 301 /; }

location = /AR  { return 301 /AR/; }

location = /setup/security { return 301 /setup/security/; }

location /setup/security/ {
    alias /usr/share/quadrf/security/;
    index index.html;
}

location = /quadrf-root-ca.cer {
    alias /etc/quadrf/tls/root-ca.cer;
    default_type application/pkix-cert;
    add_header Cache-Control "no-store";
    add_header Content-Disposition 'attachment; filename="quadrf-root-ca.cer"';
}

location = /quadrf-root-ca.mobileconfig {
    alias /etc/quadrf/tls/root-ca.mobileconfig;
    default_type application/x-apple-aspen-config;
    add_header Cache-Control "no-store";
    add_header Content-Disposition 'attachment; filename="QuadRF-Local-HTTPS.mobileconfig"';
}

location = /quadrf-root-ca.sha256 {
    alias /etc/quadrf/tls/root-ca.sha256;
    default_type text/plain;
    add_header Cache-Control "no-store";
}

location /AR/ {
    alias /usr/share/quadrf/ar/;
    index index.html;
}

location /ws {
    proxy_pass http://127.0.0.1:8000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Old bookmarks. KasmVNC needs to sit at / of a host (or port), not a path.
location = /VNC { return 302 $scheme://$host:6080/; }
location /VNC/ { return 302 $scheme://$host:6080/; }

location / {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-QuadRF-Via $server_addr;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
