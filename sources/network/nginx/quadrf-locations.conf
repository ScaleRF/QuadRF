location /GUI/ {
    rewrite ^/GUI/(.*)$ /$1 permanent;
}
location = /GUI { return 301 /; }

location = /AR  { return 301 /AR/; }

location /AR/ {
    alias /usr/share/quadrf/ar/;
    index index.html;
}

location /ws {
    proxy_pass http://127.0.0.1:8000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Old bookmarks. KasmVNC needs to sit at / of a host (or port), not a path.
location = /VNC { return 302 $scheme://$host:6080/; }
location /VNC/ { return 302 $scheme://$host:6080/; }

location / {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
