# Desktop vhost: KasmVNC at /, plus the split view which must share that
# origin so the Kasm iframe can be scripted. /GUI/split is the old bookmark.

location = /split {
    proxy_pass http://127.0.0.1:8080/split;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /split/ {
    return 301 /split;
}

location = /GUI/split {
    return 301 /split;
}

location = /GUI/split/ {
    return 301 /split;
}

location / {
    proxy_pass https://127.0.0.1:8444/;
    include snippets/quadrf-kasm-proxy.conf;
}
