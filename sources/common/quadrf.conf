# QuadRF site configuration.
#
# Read by the maintainer scripts of the quadrf-* packages, by the runtime
# helpers under /usr/lib/quadrf and by the quadrf command. Plain shell
# assignments only; re-run "quadrf apply" after editing.

# Account that owns the desktop session, the web GUI and the demo apps.
QUADRF_USER=dietpi

# Firmware partition holding config.txt, cmdline.txt and the overlays/ dir.
QUADRF_BOOT_DIR=/boot/firmware

# mDNS / nginx name (HOSTNAME.local). Not the Linux hostname, which stays
# quadrf. If another unit already has this name, this unit takes HOSTNAME-2
# unless QUADRF_HOSTNAME_LOCK is yes.
QUADRF_HOSTNAME=quadrf
QUADRF_HOSTNAME_LOCK=no

# SSID, optional WPA2 passphrase and address of the fallback access point.
# Empty QUADRF_AP_PASS keeps the AP open.
QUADRF_AP_SSID=QuadRF
QUADRF_AP_PASS=
QUADRF_AP_ADDRESS=192.168.44.1

# Last user Wi-Fi choice: sta (client), ap, or off. Empty means sta (try a
# saved client network, then the hotspot if QUADRF_WIFI_FALLBACK is yes).
QUADRF_WIFI_MODE=sta
QUADRF_WIFI_FALLBACK=yes

# OpenOCD binary used to program the FPGA. When empty the first of
# /usr/lib/quadrf/openocd/bin/openocd or /usr/bin/openocd is used.
QUADRF_OPENOCD=
