<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QuadRF Desktop + Control GUI</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #000000;
    }

    .split-container {
      display: flex;
      height: 100%;
      width: 100%;
    }

    .left-pane {
      width: 75%;
    }

    .right-pane {
      flex: 1;
    }

.pane {
  position: relative;
  overflow: hidden; 
  min-width: 0; 
  min-height: 0;
}

.pane iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
    .resizer {
      width: 8px;
      background-color: #cbd5e1;
      cursor: col-resize;
      z-index: 10;
      transition: background-color 0.2s;
      position: relative;
    }

    .resizer:hover, .resizer.active {
      background-color: #94a3b8;
    }

    .resizer::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -10px; 
      right: -10px;
      z-index: 11;
      cursor: col-resize;
    }
	
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      width: 32px;
      height: 32px;
      background-color: rgba(0, 0, 0, 0.4);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
      line-height: 1;
    }

    .close-btn:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <div class="split-container">
    <div class="pane left-pane" id="leftPane">
<iframe src="/" id="leftIframe" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    </div>
    <div class="resizer" id="resizer"></div>
    <div class="pane right-pane" id="rightPane">
	 <button class="close-btn" id="closeBtn" aria-label="Close pane">&times;</button>
      <iframe id="rightIframe"></iframe>
    </div>
  </div>

  <script>
    function controlPanelUrl() {
      const host = location.hostname;
      let panelHost = host;
      if (host.endsWith('-desktop.local')) {
        panelHost = host.slice(0, -'-desktop.local'.length) + '.local';
      } else {
        const base = host.endsWith('.local') ? host.slice(0, -'.local'.length) : host;
        if (base.length > 1 && (base.endsWith('d') || base.endsWith('D'))) {
          panelHost = base.slice(0, -1) + (host.endsWith('.local') ? '.local' : '');
        }
      }
      return `${location.protocol}//${panelHost}/#receive`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const resizer = document.getElementById('resizer');
      const leftPane = document.getElementById('leftPane');
      const leftIframe = document.getElementById('leftIframe');
      const rightIframe = document.getElementById('rightIframe');
      const iframes = document.querySelectorAll('iframe');
	  const closeBtn = document.getElementById('closeBtn');

      rightIframe.src = controlPanelUrl();

leftIframe.addEventListener('load', () => {
        try {
          const doc = leftIframe.contentDocument;
          const win = leftIframe.contentWindow;

          const style = doc.createElement('style');
          style.innerHTML = `
            #noVNC_control_bar_anchor, 
            #noVNC_control_bar { display: block !important; }
          `;
          doc.head.appendChild(style);

          win.localStorage.setItem('resize', 'remote');
          win.localStorage.setItem('kasmvnc-resize', 'remote');
          win.localStorage.setItem('novnc-resize', 'remote');

          win.dispatchEvent(new Event('storage'));
          
          if (win.UI && typeof win.UI.updateSetting === 'function') {
              win.UI.updateSetting('resize', 'remote');
          }

          setTimeout(() => {
              win.dispatchEvent(new Event('resize'));
          }, 500);
          
        } catch(e) {
          console.warn("Could not inject KasmVNC overrides.", e);
        }
      });      
      let isResizing = false;
	  
      closeBtn.addEventListener('click', () => {
        window.location.href = '/';
      });

      function startResize(e) {
        isResizing = true;
        resizer.classList.add('active');

        iframes.forEach(iframe => iframe.style.pointerEvents = 'none');
        
        document.addEventListener('mousemove', handleMove);
        document.addEventListener('touchmove', handleMove, { passive: false });
        
        document.addEventListener('mouseup', stopResize);
        document.addEventListener('touchend', stopResize);
        document.addEventListener('touchcancel', stopResize);
      }

      function handleMove(e) {
        if (!isResizing) return;
        
        if (e.type === 'touchmove') {
          e.preventDefault(); 
        }
        
        const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
        
        const containerWidth = document.body.clientWidth;
        const newLeftWidth = (clientX / containerWidth) * 100;
        
        if (newLeftWidth > 10 && newLeftWidth < 90) {
          leftPane.style.width = `${newLeftWidth}%`;
        }
      }

      function stopResize() {
        if (!isResizing) return;
        isResizing = false;
        resizer.classList.remove('active');

        iframes.forEach(iframe => iframe.style.pointerEvents = 'auto');
        
        iframes.forEach(iframe => {
          try {
            iframe.contentWindow.dispatchEvent(new Event('resize'));
          } catch(e) {}
        });
        
        document.removeEventListener('mousemove', handleMove);
        document.removeEventListener('touchmove', handleMove);
        document.removeEventListener('mouseup', stopResize);
        document.removeEventListener('touchend', stopResize);
        document.removeEventListener('touchcancel', stopResize);
      }

      resizer.addEventListener('mousedown', startResize);
      resizer.addEventListener('touchstart', startResize, { passive: false });
      
    });
  </script></body>
</html>
