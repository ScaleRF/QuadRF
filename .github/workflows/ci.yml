name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Builder image name
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          hash=$(cat packaging/Dockerfile.builder debian/control | sha256sum | awk '{print substr($1, 1, 12)}')
          echo "name=ghcr.io/${owner}/quadrf-builder:trixie-${hash}" >> "$GITHUB_OUTPUT"

      - name: Pull cached builder
        run: docker pull "${{ steps.image.outputs.name }}" || true

      - name: Build QuadRF packages
        env:
          QUADRF_BUILD_IMAGE: ${{ steps.image.outputs.name }}
        run: ./packaging/build-in-container.sh quadrf

      - name: Push builder image
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.image.outputs.name }}" || true

      - name: Upload .deb artefacts
        uses: actions/upload-artifact@v4
        with:
          name: quadrf-debs
          path: packaging/out/*.deb
          if-no-files-found: error
