name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require packaging key
        env:
          QUADRF_GPG_PRIVATE_KEY: ${{ secrets.QUADRF_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${QUADRF_GPG_PRIVATE_KEY}" ]; then
            echo "Set repository secret QUADRF_GPG_PRIVATE_KEY (armored private key)."
            echo "See packaging/README.md"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Builder image name
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          hash=$(cat packaging/Dockerfile.builder debian/control | sha256sum | awk '{print substr($1, 1, 12)}')
          echo "name=ghcr.io/${owner}/quadrf-builder:trixie-${hash}" >> "$GITHUB_OUTPUT"

      - name: Pull cached builder
        run: docker pull "${{ steps.image.outputs.name }}" || true

      - name: Build packages and apt repository
        env:
          QUADRF_BUILD_IMAGE: ${{ steps.image.outputs.name }}
          QUADRF_GPG_PRIVATE_KEY: ${{ secrets.QUADRF_GPG_PRIVATE_KEY }}
          QUADRF_GPG_PASSPHRASE: ${{ secrets.QUADRF_GPG_PASSPHRASE }}
        run: ./packaging/build-in-container.sh quadrf openocd qradiolink kasmvnc repo

      - name: Push builder image
        run: docker push "${{ steps.image.outputs.name }}" || true

      - name: Upload .deb artefacts
        uses: actions/upload-artifact@v4
        with:
          name: quadrf-debs
          path: packaging/out/*.deb
          if-no-files-found: error

      - name: Stage GitHub Pages apt tree
        run: |
          mkdir pages
          cp -a packaging/repo/dists packaging/repo/pool packaging/repo/quadrf.gpg pages/
          touch pages/.nojekyll
          cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>QuadRF apt repository</title>
          </head>
          <body>
            <h1>QuadRF apt repository</h1>
            <p>Debian trixie / arm64 packages for the Raspberry Pi 5.</p>
            <p>Install instructions:
              <a href="https://github.com/ScaleRF/QuadRF/blob/main/install/README.md">install/README.md</a>
            </p>
          </body>
          </html>
          EOF

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/out/*.deb
          generate_release_notes: true

  deploy:
    name: Deploy apt repository
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
